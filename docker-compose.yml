# One-command local stack: FastAPI backend + Next.js frontend (+ optional Ollama).
#
#   cp .env.example .env        # fill in Supabase, DATABASE_URL, SESSION_SECRET
#   docker compose up --build              # site on :3000, API on :8000
#   docker compose --profile ai up --build # also runs Ollama and pulls the model
#
# The database stays in Supabase; see docs/setup for creating the schema.

name: nexus-it-portal

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      FRONTEND_URL: http://localhost:3000
      # Only the frontend container may set X-Forwarded-For (rate limiting)
      TRUSTED_PROXY_IPS: 172.28.0.10
      # Ollama service from the "ai" profile. For Ollama on the host instead:
      # DOCKER_AI_BASE_URL=http://host.docker.internal:11434/v1
      AI_BASE_URL: ${DOCKER_AI_BASE_URL:-http://ollama:11434/v1}
    ports:
      - "8000:8000"
    networks:
      app:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_BACKEND_API_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    env_file: .env
    environment:
      # Server-side calls go over the compose network; the browser uses localhost
      BACKEND_INTERNAL_URL: http://backend:8000
      # Plain http on localhost; real deployments keep the HTTPS redirect
      FORCE_HTTPS: "false"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]
    restart: unless-stopped

  # One-shot: downloads the model into the shared volume, then exits
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [ai]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${AI_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks: [app]

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  ollama:
